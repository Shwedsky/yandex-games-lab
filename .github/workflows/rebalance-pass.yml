name: One-shot mutants rebalance pass

on:
  push:
    branches:
      - feature/mutants-playable-v0
    paths:
      - .github/workflows/rebalance-pass.yml
      - scripts/rebalance_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mutants-playable-v0
          fetch-depth: 0
      - name: Patch game integration
        run: python3 scripts/rebalance_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mutants-merge/src/game.ts
          git diff --cached --quiet || git commit -m "feat(mutants): rebalance economy, visuals and mock ad UX"
          git push origin HEAD:feature/mutants-playable-v0
