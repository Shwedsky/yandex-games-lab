name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Mutants
        run: npm run build:mutants

      - name: Build Reseller
        run: npm run build:reseller

      - name: Verify Mutants package shape
        run: |
          test -f apps/mutants-merge/dist/index.html
          test $(du -sm apps/mutants-merge/dist | cut -f1) -lt 100

      - name: Upload Mutants browser build
        uses: actions/upload-artifact@v4
        with:
          name: mutants-browser-build
          path: apps/mutants-merge/dist/
          if-no-files-found: error
          retention-days: 7
