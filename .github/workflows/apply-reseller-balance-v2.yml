name: Apply Reseller Balance V2
on:
  push:
    branches: [feature/reseller-playable-v1]
    paths:
      - scripts/patch-reseller-balance-v2.mjs
      - .github/workflows/apply-reseller-balance-v2.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reseller-playable-v1
      - run: node scripts/patch-reseller-balance-v2.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/reseller-empire/src/main.ts apps/reseller-empire/src/style.css
          git diff --cached --quiet && exit 1
          git commit -m "fix(reseller): rebalance trading and clarify progression"
          git push origin HEAD:feature/reseller-playable-v1
