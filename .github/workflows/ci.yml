name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Mutants
        run: npm run build:mutants

      - name: Build Reseller
        run: npm run build:reseller

      - name: Verify Yandex package
        run: node scripts/verify-yandex-package.mjs

      - name: Browser gameplay smoke test
        run: |
          python3 -m http.server 4173 --directory apps/mutants-merge/dist >/tmp/mutants-server.log 2>&1 &
          SERVER_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_PROFILE=/tmp/mutants-chrome
          rm -rf "$CHROME_PROFILE"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=540,960 --remote-debugging-port=0 --user-data-dir="$CHROME_PROFILE" "http://127.0.0.1:4173/?mockAds=1" >/tmp/mutants-chrome.log 2>&1 &
          CHROME_PID=$!
          cleanup() { kill $CHROME_PID $SERVER_PID 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 50); do
            if test -s "$CHROME_PROFILE/DevToolsActivePort"; then break; fi
            sleep 0.2
          done
          if ! test -s "$CHROME_PROFILE/DevToolsActivePort"; then
            cat /tmp/mutants-chrome.log
            exit 1
          fi
          CDP_PORT=$(head -n1 "$CHROME_PROFILE/DevToolsActivePort")
          set +e
          CDP_HOST="http://127.0.0.1:$CDP_PORT" node scripts/browser-smoke.mjs >mutants-smoke.log 2>&1
          SMOKE_STATUS=$?
          set -e
          cp /tmp/mutants-chrome.log mutants-chrome.log || true
          cp /tmp/mutants-server.log mutants-server.log || true
          cat mutants-smoke.log
          ls -lah mutants-smoke* mutants-chrome.log mutants-server.log 2>/dev/null || true
          if [ "$SMOKE_STATUS" -ne 0 ]; then exit "$SMOKE_STATUS"; fi
          test -s mutants-smoke-start.png
          test -s mutants-smoke-play.png
          test -s mutants-smoke-collection.png
          test -s mutants-smoke-report.json

      - name: Prepare Windows test kit
        if: success()
        run: |
          rm -rf test-kit
          mkdir -p test-kit
          cp -R apps/mutants-merge/dist/. test-kit/
          cp tools/START_TEST.cmd test-kit/
          cp tools/START_TEST.ps1 test-kit/
          cp tools/README_TEST.txt test-kit/

      - name: Upload Yandex package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-yandex-package
          path: apps/mutants-merge/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload human test kit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-test-kit
          path: test-kit/
          if-no-files-found: error
          retention-days: 7

      - name: Upload CI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-ci-smoke
          path: |
            mutants-smoke*.png
            mutants-smoke*.json
            mutants-smoke.log
            mutants-chrome.log
            mutants-server.log
          if-no-files-found: warn
          retention-days: 7
