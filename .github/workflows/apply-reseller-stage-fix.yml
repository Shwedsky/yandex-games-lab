name: Apply Reseller Stage Fix
on:
  push:
    branches: [feature/reseller-playable-v1]
    paths:
      - scripts/fix-reseller-stage-duplicate.mjs
      - .github/workflows/apply-reseller-stage-fix.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reseller-playable-v1
      - run: node scripts/fix-reseller-stage-duplicate.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/reseller-empire/src/main.ts
          git diff --cached --quiet && exit 1
          git commit -m "fix(reseller): remove duplicate stage declaration"
          git push origin HEAD:feature/reseller-playable-v1
