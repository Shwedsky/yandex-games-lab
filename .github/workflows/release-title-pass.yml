name: One-shot mutants release title pass

on:
  push:
    branches:
      - feature/mutants-playable-v0
    paths:
      - scripts/release_title_patch.py
      - .github/workflows/release-title-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mutants-playable-v0
          fetch-depth: 0
      - name: Patch release title
        run: python3 scripts/release_title_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mutants-merge/src/game.ts
          git diff --cached --quiet || git commit -m "chore(mutants): set catalog release title"
          git push origin HEAD:feature/mutants-playable-v0
