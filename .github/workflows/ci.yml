name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Mutants
        run: npm run build:mutants

      - name: Build Reseller
        run: npm run build:reseller

      - name: Verify Yandex package
        run: node scripts/verify-yandex-package.mjs

      - name: Prepare Windows test kit
        run: |
          rm -rf .test-kit
          mkdir -p .test-kit
          cp -R apps/mutants-merge/dist/. .test-kit/
          cp tools/START_TEST.cmd .test-kit/
          cp tools/START_TEST.ps1 .test-kit/
          cp tools/README_TEST.txt .test-kit/

      - name: Upload Yandex package
        uses: actions/upload-artifact@v4
        with:
          name: mutants-yandex-package
          path: apps/mutants-merge/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload human test kit
        uses: actions/upload-artifact@v4
        with:
          name: mutants-test-kit
          path: .test-kit/
          if-no-files-found: error
          retention-days: 7
