name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Mutants
        run: npm run build:mutants

      - name: Build Reseller
        run: npm run build:reseller

      - name: Verify Yandex package
        run: node scripts/verify-yandex-package.mjs

      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 --directory apps/mutants-merge/dist >/tmp/mutants-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=540,960 --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:4173/?mockAds=1" > mutants-dom.html
          grep -q '<canvas' mutants-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=540,960 --virtual-time-budget=2500 --screenshot=mutants-smoke.png "http://127.0.0.1:4173/?mockAds=1"
          test -s mutants-smoke.png

      - name: Prepare Windows test kit
        run: |
          rm -rf test-kit
          mkdir -p test-kit
          cp -R apps/mutants-merge/dist/. test-kit/
          cp tools/START_TEST.cmd test-kit/
          cp tools/START_TEST.ps1 test-kit/
          cp tools/README_TEST.txt test-kit/

      - name: Upload Yandex package
        uses: actions/upload-artifact@v4
        with:
          name: mutants-yandex-package
          path: apps/mutants-merge/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload human test kit
        uses: actions/upload-artifact@v4
        with:
          name: mutants-test-kit
          path: test-kit/
          if-no-files-found: error
          retention-days: 7

      - name: Upload CI smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: mutants-ci-smoke
          path: |
            mutants-smoke.png
            mutants-dom.html
          if-no-files-found: error
          retention-days: 7
