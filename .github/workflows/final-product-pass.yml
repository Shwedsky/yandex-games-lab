name: Apply final product pass

on:
  push:
    branches:
      - feature/mutants-playable-v0
    paths:
      - scripts/apply-final-product-pass.mjs
      - .github/workflows/final-product-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mutants-playable-v0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-final-product-pass.mjs
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mutants-merge/src/game.ts apps/mutants-merge/src/content.ts apps/mutants-merge/src/visuals.ts scripts/browser-smoke.mjs
          git diff --cached --check
          git commit -m "feat(mutants): tune first unlock and selected removal"
          git push origin HEAD:feature/mutants-playable-v0
